name: Sync to Hugging Face Space
on:
  push:
    branches: [release_with_huggingface]
  workflow_dispatch:
jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Push clean commit to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          rm -rf .git
          git config --global user.email "bot@action.com"
          git config --global user.name "GitHub Action Bot"
          git init
          git branch -M main
          git lfs install
          git lfs track "*.csv" "*.parquet" "*.pkl"
          git add .
          git commit -m "Deploy to Hugging Face"
          git push --force https://mejb:$HF_TOKEN@huggingface.co/spaces/mejb/cityofpulse main